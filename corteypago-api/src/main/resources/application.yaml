spring:
  application:
    name: corteypago-api
  jpa:
    hibernate:
      ddl-auto: validate          # el esquema lo maneja Flyway, no Hibernate
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # rechaza campos que no existen, como "cardNumber"

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}